        function getColor(d) {
            return d > 10000 ? "#800026" :
                   d > 5000  ? "#BD0026" :
                   d > 2000  ? "#E31A1C" :
                   d > 1000  ? "#FC4E2A" :
                   d > 500   ? "#FD8D3C" :
                   d > 100   ? "#FEB24C" :
                   d > 0     ? "#FED976" :
                               "#ECEFF1";
        }

        function style(feature) {
            return {
                fillColor: getColor(feature.properties.pickups),
                weight: 1,
                opacity: 0.8,
                color: "#475569",
                fillOpacity: 0.72
            };
        }

        var info = L.control({ position: "topright" });
        info.onAdd = function (map) {
            this._div = L.DomUtil.create("div", "info");
            this.update();
            return this._div;
        };
        info.update = function (props) {
            this._div.innerHTML = "<h4>NYC Taxi Pickup Demand</h4>" + (props ?
                "<b>" + props.zone + "</b> (" + props.borough + ")<br/>" +
                "Pickups: <b>" + Number(props.pickups).toLocaleString() + " trips</b><br/>" +
                "Average Fare: <b>$" + Number(props.avg_fare).toFixed(2) + "</b>"
                : "Hover over a taxi district");
        };
        info.addTo(map);

        var geojson;

        function highlightFeature(e) {
            var layer = e.target;
            layer.setStyle({
                weight: 2.5,
                color: "#1e293b",
                fillOpacity: 0.9
            });
            if (!L.Browser.ie && !L.Browser.opera && !L.Browser.edge) {
                layer.bringToFront();
            }
            info.update(layer.feature.properties);
        }

        function resetHighlight(e) {
            geojson.resetStyle(e.target);
            info.update();
        }

        function zoomToFeature(e) {
            map.fitBounds(e.target.getBounds());
        }

        function onEachFeature(feature, layer) {
            layer.on({
                mouseover: highlightFeature,
                mouseout: resetHighlight,
                click: zoomToFeature
            });
            layer.bindPopup(
                "<strong>Zone:</strong> " + feature.properties.zone + "<br/>" +
                "<strong>Borough:</strong> " + feature.properties.borough + "<br/>" +
                "<strong>Total Pickups:</strong> " + Number(feature.properties.pickups).toLocaleString() + "<br/>" +
                "<strong>Avg Fare:</strong> $" + Number(feature.properties.avg_fare).toFixed(2)
            );
        }

        geojson = L.geoJson(geojsonData, {
            style: style,
            onEachFeature: onEachFeature
        }).addTo(map);

        // Major Hub Markers
        var hubs = [
            { name: "JFK International Airport", lat: 40.6413, lng: -73.7781, note: "Major Long-Distance Hub" },
            { name: "LaGuardia Airport", lat: 40.7769, lng: -73.8740, note: "Key Airport Transit Hub" },
            { name: "Times Square / Midtown", lat: 40.7580, lng: -73.9855, note: "Highest Pickup Concentration" },
            { name: "Financial District / Wall St", lat: 40.7075, lng: -74.0090, note: "Downtown Financial Center" }
        ];

        hubs.forEach(function(h) {
            L.circleMarker([h.lat, h.lng], {
                radius: 7,
                fillColor: "#0284c7",
                color: "#ffffff",
                weight: 2,
                opacity: 1,
                fillOpacity: 0.95
            }).bindPopup("<b>" + h.name + "</b><br/>" + h.note).addTo(map);
        });

        // Legend
        var legend = L.control({ position: "bottomright" });
        legend.onAdd = function (map) {
            var div = L.DomUtil.create("div", "info legend"),
                grades = [0, 100, 500, 1000, 2000, 5000, 10000];

            div.innerHTML = "<strong>Pickup Trips</strong><br>";
            for (var i = 0; i < grades.length; i++) {
                div.innerHTML +=
                    '<i style="background:' + getColor(grades[i] + 1) + '"></i> ' +
                    grades[i] + (grades[i + 1] ? '&ndash;' + grades[i + 1] + '<br>' : '+');
            }
            return div;
        };
        legend.addTo(map);
    </script>
